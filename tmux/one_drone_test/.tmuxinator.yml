root: ./
name: simulation
startup_window: tui
pre_window: export UAV_NAME=uav1; export UAV_TYPE=lr7pro
windows:
  - spawn:
      layout: even-horizontal
      panes:
        - ros2 launch laser_challenge_simulation gazebo.launch.py real_time:=1.0
        - ros2 launch laser_uav_simulation spawn_drones.launch.py spawn_drones_file:=./configs/spawn.yaml
  - px4_api:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_px4_api api.launch.py api_file:="./configs/api.yaml"
        - sleep 1; ros2 run laser_uav_simulation autostart.py 
  - estimation_manager:
      layout: tiled
      panes:
        - sleep 2; ros2 launch laser_uav_managers estimation_manager.launch.py params_file:="./configs/estimation_manager.yaml"
  - tui:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 run laser_uav_tui tui
  - gesture:
      layout: even-horizontal
      panes:
        - 'history -s ros2 run laser_uav_missions gesture_control'
  - spawn_bases:
      layout: even-horizontal
      panes:
        - 'history -s ros2 run laser_challenge_simulation base_spawner.py' 
  - control_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers control_manager.launch.py
        - 'history -s ros2 service call /$UAV_NAME/px4_api/arm std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/takeoff std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/land std_srvs/srv/Trigger {}'
  - fast_lio:
      layout: tiled
      panes:
        - ros2 launch laser_fast_lio_core fast_lio.launch.py topic_imu:=/$UAV_NAME/livox/imu topic_pcl:=/$UAV_NAME/livox/lidar fast_lio_config_file_path:=./configs/fast_lio.yaml
  - odometry:
      layout: even-horizontal
      panes:
        - sleep 6; ros2 topic echo --no-arr /$UAV_NAME/ground_truth
        - sleep 6; ros2 topic echo --no-arr /$UAV_NAME/estimation_manager/estimation
  - goto:
      layout: tiled 
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/control_manager/goto laser_msgs/msg/PoseWithHeading \"{position: {x: 0.0, y: 0.0, z: 1.5}, heading: 0.0}\"'
  - rviz:
      layout: tiled
      panes:
        - sleep 10; ros2 launch laser_fast_lio_core rviz.launch.py
